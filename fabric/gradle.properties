# Gradle settings for the Fabric build only. A `-p fabric` invocation treats
# this directory as the build root, so the root gradle.properties is NOT read
# here -- the org.gradle.* performance settings are duplicated, while the mod
# properties (mod_id, mod_version, ...) are loaded from ../gradle.properties by
# build.gradle so they cannot drift from the other loaders.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Unlike the other loaders, Fabric has THREE version inputs. All of them are
# defaults for local development; CI overrides them per target with -P flags
# from versions.json (targets[].minecraft, targets[].fabric, fabric_loader).
minecraft_version=26.2
fabric_api_version=0.161.0+26.2
loader_version=0.19.5

loom_version=1.17-SNAPSHOT

## Universal jar compatibility ranges (fabric.mod.json semver dialect, not maven)
# One jar covers every supported 26.x version. Fabric support deliberately
# starts at Minecraft 26.1, where Mojang stopped obfuscating the game: earlier
# versions would need intermediary-remapped builds per version, and NeoForge
# already covers those players.
fabric_minecraft_version_range=>=26.1
fabric_loader_range=>=0.16.0
