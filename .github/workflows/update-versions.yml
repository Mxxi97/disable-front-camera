name: Check for new Minecraft versions

on:
  schedule:
    # Daily, 06:00 UTC. Cheap: only the single-runner discover job runs on a
    # quiet day; try-build and update only start when a new version appeared.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write # the update job dispatches release.yml

jobs:
  discover:
    name: Discover
    runs-on: ubuntu-latest
    outputs:
      stale: ${{ steps.check.outputs.stale }}
      added: ${{ steps.check.outputs.added }}
      beta_only: ${{ steps.check.outputs.beta_only || 'false' }}
      release_needed: ${{ steps.check.outputs.release_needed || 'false' }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compare versions.json against the NeoForge maven
        id: check
        run: node .github/scripts/discover-versions.mjs --check --soft

      - id: matrix
        if: steps.check.outputs.stale == 'true'
        # Same per-loader expansion as build.yml: every added target is tried on
        # NeoForge, and on Fabric too when Fabric API has a build for it. The
        # Fabric loader version comes from the script's output, NOT from
        # versions.json -- this checkout still has the old file.
        run: |
          echo '${{ steps.check.outputs.added }}' \
            | jq -c --arg fl "${{ steps.check.outputs.fabric_loader }}" '{include: [ .[]
              | {minecraft, loader: "neoforge", version: .neoforge},
                (select(.fabric != null) | {minecraft, loader: "fabric", version: .fabric, fabric_loader: $fl}) ]}' \
            > matrix.json
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"

      - name: Nothing to do
        if: steps.check.outputs.stale != 'true'
        run: echo "Already building against every available NeoForge version." >> "$GITHUB_STEP_SUMMARY"

  # New versions are built before anything is committed, so versions.json never
  # gains a target that does not compile.
  try-build:
    name: Try MC ${{ matrix.minecraft }} (${{ matrix.loader }})
    needs: discover
    if: needs.discover.outputs.stale == 'true' && needs.discover.outputs.added != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          if [ "${{ matrix.loader }}" = "fabric" ]; then
            ./gradlew -p fabric build --no-daemon \
              -Pminecraft_version=${{ matrix.minecraft }} \
              -Pfabric_api_version=${{ matrix.version }} \
              -Ploader_version=${{ matrix.fabric_loader }} 2>&1 | tee build.log
          else
            ./gradlew build --no-daemon -Pneo_version=${{ matrix.version }} 2>&1 | tee build.log
          fi

      - name: Open an issue if it no longer compiles
        if: steps.build.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "Port to Minecraft ${{ matrix.minecraft }} (${{ matrix.loader }} ${{ matrix.version }})"
        run: |
          # Don't file the same issue every week.
          existing=$(gh issue list --state open --search "$TITLE in:title" --json number --jq 'length')
          if [ "$existing" != "0" ]; then
            echo "An open issue already tracks this version."
            exit 0
          fi

          {
            echo "Minecraft **${{ matrix.minecraft }}** is out and ${{ matrix.loader }} **${{ matrix.version }}** is available,"
            echo "but the mod no longer compiles against it, so it was not added to \`versions.json\`."
            echo
            echo "Every other supported version and loader is unaffected and still builds."
            echo
            echo "### How to fix"
            echo
            if [ "${{ matrix.loader }}" = "fabric" ]; then
              echo "The Fabric build is a single universal source tree (no per-version overlay),"
              echo "so fix it directly in:"
              echo
              echo '```'
              echo "fabric/src/main/java/drHirsch/disable_front_camera/"
              echo '```'
              echo
              echo "Then verify with:"
              echo
              echo '```'
              echo "./gradlew -p fabric build -Pminecraft_version=${{ matrix.minecraft }} -Pfabric_api_version=${{ matrix.version }} -Ploader_version=${{ matrix.fabric_loader }}"
              echo "node .github/scripts/discover-versions.mjs"
              echo '```'
            else
              echo "Put a replacement for whichever source file broke in:"
              echo
              echo '```'
              echo "src/versions/${{ matrix.minecraft }}/java/drHirsch/disable_front_camera/"
              echo '```'
              echo
              echo "A file there replaces the same-named file under \`src/main/java\` for this"
              echo "version only. Then run:"
              echo
              echo '```'
              echo "node .github/scripts/build-all.mjs --only ${{ matrix.version }}"
              echo "node .github/scripts/discover-versions.mjs"
              echo '```'
            fi
            echo
            echo "### Compile errors"
            echo
            echo '```'
            grep -E '^(e: |error:|.*\.java:[0-9]+:|> Task .* FAILED|FAILURE:|Caused by:)' build.log | head -40 || tail -40 build.log
            echo '```'
          } > issue.md

          gh issue create --title "$TITLE" --body-file issue.md --label "version-port" || \
            gh issue create --title "$TITLE" --body-file issue.md

      # Without this the job would conclude "success" even when the build failed:
      # continue-on-error leaves the step's *outcome* as failure but its *conclusion*
      # as success, and creating the issue exits 0. The update job below gates on
      # this job's result, so the gate would never actually close.
      # fail-fast is off, so every new target is still attempted and still files its
      # own issue before this runs.
      - name: Fail the job if this version does not compile
        if: steps.build.outcome != 'success'
        run: exit 1

  # Only if every new target built. If one failed, its issue is the signal, and the
  # next scheduled run will pick things up once it has been ported.
  #
  # This is the zero-touch path: no PR, no human. try-build has just proven every
  # new target compiles, so the update is committed straight to main, then:
  # - release-needed additions: bump/tag/dispatch the release workflow
  # - beta-only additions on already-supported Minecraft versions: metadata sync
  #   on the existing NeoForge Modrinth version (no new mod release artifact)
  update:
    name: Update versions.json and release
    needs: [discover, try-build]
    # try-build is 'skipped' when the change is metadata-only (no new targets):
    # a parchment, ModDev, Fabric API or Fabric loader update. Those must still
    # be committed -- gating on try-build success alone would leave versions.json
    # permanently stale and this workflow reporting the same diff every day.
    # Release-worthy changes (new targets) additionally require try-build green.
    if: ${{ !cancelled() && needs.discover.outputs.stale == 'true' && (needs.try-build.result == 'success' || needs.try-build.result == 'skipped') }}
    runs-on: ubuntu-latest
    # Same group as cut-release.yml, so the automation can never race a manual
    # release into conflicting pushes on main.
    concurrency: cut-release
    steps:
      - uses: actions/checkout@v4
        with:
          # The bump script skips versions whose tag already exists, so it needs
          # the full tag list, which a shallow checkout does not have.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate versions.json and the README table
        run: node .github/scripts/discover-versions.mjs

      # Metadata-only path: either no new target at all, or only NeoForge beta
      # bumps for Minecraft versions already supported in versions.json.
      - name: Commit metadata-only update
        if: needs.discover.outputs.added == '[]' || needs.discover.outputs.beta_only == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions.json README.md
          git commit -m "${{ needs.discover.outputs.beta_only == 'true' && 'Support new NeoForge beta metadata' || 'Update version metadata' }}"
          git push origin main

      - name: Sync NeoForge game version metadata on Modrinth
        if: needs.discover.outputs.beta_only == 'true'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_ID || 'WklfOz03' }}
        run: |
          set -euo pipefail

          if [ -z "$MODRINTH_TOKEN" ]; then
            echo "::error title=Missing MODRINTH_TOKEN::Add MODRINTH_TOKEN under Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi

          current_version=$(sed -n 's/^mod_version=//p' gradle.properties)
          if [ -z "$current_version" ]; then
            echo "::error title=Missing mod_version::Could not read mod_version from gradle.properties."
            exit 1
          fi

          # Current repository source of truth for NeoForge support matrix.
          expected_game_versions=$(jq -c '[.targets[].minecraft]' versions.json)
          expected_count=$(echo "$expected_game_versions" | jq 'length')
          if [ "$expected_count" -eq 0 ]; then
            echo "::error title=Empty versions.json::No Minecraft targets were found to sync to Modrinth."
            exit 1
          fi

          echo "Looking up NeoForge Modrinth version '$current_version' for project '$MODRINTH_PROJECT_ID'..."
          listing_url="https://api.modrinth.com/v2/project/${MODRINTH_PROJECT_ID}/version?loaders=%5B%22neoforge%22%5D"
          listing=$(curl -fsS -H "Authorization: $MODRINTH_TOKEN" "$listing_url")
          version_json=$(echo "$listing" | jq --arg v "$current_version" '[.[] | select(.version_number == $v)] | first')
          version_id=$(echo "$version_json" | jq -r '.id // empty')

          if [ -z "$version_id" ]; then
            echo "::error title=Modrinth version not found::No NeoForge Modrinth version has version_number '$current_version'. Ensure a release exists before beta-only sync runs."
            echo "Available NeoForge versions on Modrinth:"
            echo "$listing" | jq -r '.[].version_number' | sed 's/^/  - /'
            exit 1
          fi

          loaders=$(echo "$version_json" | jq -c '.loaders // []')
          patch_url="https://api.modrinth.com/v2/version/${version_id}"
          patch_body=$(jq -cn --argjson gv "$expected_game_versions" '{game_versions: $gv}')

          # Prefer touching only game_versions. If the API requires loaders too,
          # retry once preserving the current loaders from the version object.
          response_file=$(mktemp)
          status=$(curl -sS -o "$response_file" -w '%{http_code}' \
            -X PATCH "$patch_url" \
            -H "Authorization: $MODRINTH_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$patch_body")
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            patch_body=$(jq -cn --argjson gv "$expected_game_versions" --argjson ld "$loaders" '{game_versions: $gv, loaders: $ld}')
            status=$(curl -sS -o "$response_file" -w '%{http_code}' \
              -X PATCH "$patch_url" \
              -H "Authorization: $MODRINTH_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$patch_body")
          fi
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error title=Modrinth PATCH failed::HTTP $status while updating version '$version_id'."
            cat "$response_file"
            rm -f "$response_file"
            exit 1
          fi
          rm -f "$response_file"

          verify () {
            check_listing=$(curl -fsS -H "Authorization: $MODRINTH_TOKEN" "$listing_url")
            check_json=$(echo "$check_listing" | jq --arg v "$current_version" '[.[] | select(.version_number == $v)] | first')
            if [ "$check_json" = "null" ] || [ -z "$check_json" ]; then
              echo "Modrinth still does not list NeoForge version '$current_version'."
              return 1
            fi
            actual_count=$(echo "$check_json" | jq '.game_versions | length')
            if [ "$actual_count" != "$expected_count" ]; then
              echo "Game version count is $actual_count, expected $expected_count."
              return 1
            fi
            missing=$(jq -cn --argjson expected "$expected_game_versions" --argjson actual "$(echo "$check_json" | jq -c '.game_versions')" '$expected - $actual')
            if [ "$missing" != "[]" ]; then
              echo "Modrinth version is missing Minecraft versions: $missing"
              return 1
            fi
            echo "Synced NeoForge Modrinth metadata for $current_version across $actual_count Minecraft versions."
          }

          # Allow for API eventual consistency.
          for attempt in 1 2 3 4 5 6; do
            if verify; then
              {
                echo "Updated NeoForge Modrinth metadata for **$current_version**."
                echo
                echo "- No mod_version bump, tag, or release was created (beta-only path)."
                echo "- Synced game_versions count: $expected_count"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$attempt" != "6" ]; then
              echo "Attempt $attempt: metadata not visible yet, retrying in 20s..."
              sleep 20
            fi
          done

          echo "::error title=Modrinth verification failed::game_versions update did not become visible after retries."
          exit 1

      - name: Bump mod_version
        if: needs.discover.outputs.release_needed == 'true'
        id: bump
        run: node .github/scripts/bump-version.mjs --bump patch

      - name: Commit, tag and push
        if: needs.discover.outputs.release_needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions.json README.md gradle.properties
          git commit -m "Support new Minecraft versions; release v${{ steps.bump.outputs.version }}"
          # Tag the bump commit itself so the tag's gradle.properties always
          # matches the tag name -- releases publish what gradle.properties says.
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin main "v${{ steps.bump.outputs.version }}"

      - name: Dispatch the release workflow
        if: needs.discover.outputs.release_needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The tag push above cannot trigger release.yml: events created with
          # GITHUB_TOKEN never start other workflows. workflow_dispatch is the
          # documented exception, and dispatching AT THE TAG REF makes release.yml
          # check out the freshly committed versions.json and gradle.properties.
          gh workflow run release.yml --ref "v${{ steps.bump.outputs.version }}"
          {
            echo "Released **v${{ steps.bump.outputs.version }}** with the new game versions."
            echo
            echo "Publishing runs in the [Release workflow](${{ github.server_url }}/${{ github.repository }}/actions/workflows/release.yml)."
          } >> "$GITHUB_STEP_SUMMARY"
