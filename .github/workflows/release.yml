name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The full matrix is the release gate. One universal jar is only safe to publish
  # because every supported version has just been proven to compile.
  verify:
    name: Verify all versions
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          # Build against the OLDEST supported NeoForge. The bytecode is identical
          # across the range, and the oldest toolchain emits Java 21 class files,
          # which the Java 25 JVM used by Minecraft 26.x loads happily. The reverse
          # is not true, so this direction matters.
          neoforge=$(jq -r '.targets[0].neoforge' versions.json)
          # Underscore, not a hyphen: in GitHub expressions "outputs.game-versions"
          # parses as a subtraction, so the value would silently arrive empty.
          game_versions=$(jq -r '[.targets[].minecraft] | join(",")' versions.json)
          # From gradle.properties, not the tag name, so that a manual
          # workflow_dispatch run does not try to publish a version called "main".
          version=$(sed -n 's/^mod_version=//p' gradle.properties)

          # mc-publish only complains about these once the jar is already built.
          for pair in "neoforge=$neoforge" "game_versions=$game_versions" "version=$version"; do
            if [ "${pair#*=}" = "" ]; then
              echo "::error title=Empty release input::${pair%%=*} resolved to nothing. Check versions.json and gradle.properties."
              exit 1
            fi
          done

          echo "NeoForge:      $neoforge"
          echo "Version:       $version"
          echo "Game versions: $game_versions"

          {
            echo "neoforge=$neoforge"
            echo "game_versions=$game_versions"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Check publishing credentials
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          if [ -z "$MODRINTH_TOKEN" ]; then
            echo "::error title=Missing MODRINTH_TOKEN::Add it under Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi
          # Fail here with a clear message rather than deep inside mc-publish, which
          # reports credential problems only after the jar has already been built.
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: $MODRINTH_TOKEN" https://api.modrinth.com/v2/user)
          if [ "$code" != "200" ]; then
            echo "::error title=MODRINTH_TOKEN rejected::Modrinth returned HTTP $code for /v2/user. Create a new token at https://modrinth.com/settings/pats with BOTH 'Read user data' and 'Create versions' scopes, then update the MODRINTH_TOKEN secret."
            echo "Note: /v2/user needs the 'Read user data' scope, so a token scoped only to 'Create versions' also fails here even though it could publish." >&2
            exit 1
          fi
          echo "MODRINTH_TOKEN is valid."

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build universal jar
        run: ./gradlew build --no-daemon -Pneo_version=${{ steps.meta.outputs.neoforge }}

      - name: Sanity-check the jar
        run: |
          jar=$(ls build/libs/*.jar)
          echo "Publishing $jar"
          # Java 21 bytecode is class-file major version 65. Anything higher would
          # fail to load on the 1.21.x half of the supported range.
          unzip -p "$jar" drHirsch/disable_front_camera/Disable_front_camera.class \
            | od -An -tu1 -j6 -N2 \
            | awk '{v=$1*256+$2; print "class file major version: " v; if (v != 65) { print "::error::Expected 65 (Java 21), got " v; exit 1 }}'
          unzip -p "$jar" META-INF/neoforge.mods.toml

      - uses: Kira-NT/mc-publish@v3.3.1
        with:
          # The immutable Modrinth project id, not the slug, so renaming the project
          # cannot break releases. It is public (the API serves it to anyone) and is
          # set here rather than in repository config because an empty modrinth-id
          # makes mc-publish fail before publishing anything, and a repo variable is
          # easy to get wrong -- it must be a Variable, not a Secret.
          # vars.MODRINTH_ID still overrides this if it is ever set.
          modrinth-id: ${{ vars.MODRINTH_ID || 'WklfOz03' }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: build/libs/*.jar
          loaders: neoforge
          # Every version the matrix just verified, listed explicitly rather than
          # inferred from the jar's version range.
          game-versions: ${{ steps.meta.outputs.game_versions }}
          game-version-filter: none
          version: ${{ steps.meta.outputs.version }}
          name: v${{ steps.meta.outputs.version }}
          version-type: release
