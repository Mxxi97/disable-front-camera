name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  issues: write # the notify job files an issue when a release fails

jobs:
  # The full matrix is the release gate. One universal jar is only safe to publish
  # because every supported version has just been proven to compile.
  verify:
    name: Verify all versions
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          # Build against the OLDEST supported NeoForge. The bytecode is identical
          # across the range, and the oldest toolchain emits Java 21 class files,
          # which the Java 25 JVM used by Minecraft 26.x loads happily. The reverse
          # is not true, so this direction matters.
          neoforge=$(jq -r '.targets[0].neoforge' versions.json)
          # From gradle.properties, not the tag name, so that a manual
          # workflow_dispatch run does not try to publish a version called "main".
          version=$(sed -n 's/^mod_version=//p' gradle.properties)

          # NEWLINE separated, not comma separated. mc-publish declares game-versions
          # as string[] and splits array inputs on /\r?\n/ by default, so a comma
          # separated value is never split. The whole string is then handed to the
          # Minecraft version provider as a version *range*, "1.21.1,1.21.2,..." does
          # not parse as one, and an unparseable range becomes a range that matches
          # nothing -- leaving zero game versions and failing inside mc-publish with
          # "At least one game version should be specified", despite the input having
          # looked perfectly populated in the run log.
          game_versions=$(jq -r '.targets[].minecraft' versions.json)

          # The Forge jar has its own, narrower axis: oldest supported Forge (same
          # oldest-first reasoning) and only the game versions Forge covers. Both
          # may be empty if Forge ever drops out of versions.json entirely -- the
          # Forge steps below are skipped in that case rather than failing the
          # NeoForge release.
          forge=$(jq -r '[.targets[] | select(.forge != null)][0].forge // empty' versions.json)
          forge_game_versions=$(jq -r '.targets[] | select(.forge != null) | .minecraft' versions.json)

          count=$(printf '%s\n' "$game_versions" | grep -c .)
          forge_count=$(printf '%s\n' "$forge_game_versions" | grep -c . || true)
          if [ -z "$neoforge" ] || [ -z "$version" ] || [ "$count" -eq 0 ]; then
            echo "::error title=Empty release input::Resolved neoforge='$neoforge' version='$version' game versions=$count. Check versions.json and gradle.properties."
            exit 1
          fi

          echo "NeoForge:            $neoforge"
          echo "Forge:               ${forge:-none}"
          echo "Version:             $version"
          echo "Game versions:       $count"
          printf '  %s\n' $game_versions
          echo "Forge game versions: $forge_count"
          printf '  %s\n' $forge_game_versions

          {
            echo "neoforge=$neoforge"
            echo "forge=$forge"
            echo "version=$version"
            echo "game_version_count=$count"
            echo "forge_game_version_count=$forge_count"
            # Multi-line values need the delimiter form.
            echo "game_versions<<GAME_VERSIONS_EOF"
            printf '%s\n' "$game_versions"
            echo "GAME_VERSIONS_EOF"
            echo "forge_game_versions<<FORGE_GAME_VERSIONS_EOF"
            printf '%s\n' "$forge_game_versions"
            echo "FORGE_GAME_VERSIONS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check publishing credentials
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          if [ -z "$MODRINTH_TOKEN" ]; then
            echo "::error title=Missing MODRINTH_TOKEN::Add it under Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi
          # Fail here with a clear message rather than deep inside mc-publish, which
          # reports credential problems only after the jar has already been built.
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: $MODRINTH_TOKEN" https://api.modrinth.com/v2/user)
          if [ "$code" != "200" ]; then
            echo "::error title=MODRINTH_TOKEN rejected::Modrinth returned HTTP $code for /v2/user. Create a new token at https://modrinth.com/settings/pats with BOTH 'Read user data' and 'Create versions' scopes, then update the MODRINTH_TOKEN secret."
            echo "Note: /v2/user needs the 'Read user data' scope, so a token scoped only to 'Create versions' also fails here even though it could publish." >&2
            exit 1
          fi
          echo "MODRINTH_TOKEN is valid."

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 21 for the NeoForge universal jar, 25 for the Forge (26.x-only) jar.
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build universal jar (NeoForge)
        run: ./gradlew build --no-daemon -Pneo_version=${{ steps.meta.outputs.neoforge }}

      - name: Build universal jar (Forge)
        if: steps.meta.outputs.forge != ''
        run: ./gradlew -p forge build --no-daemon -Pforge_version=${{ steps.meta.outputs.forge }}

      - name: Sanity-check the NeoForge jar
        run: |
          jar=$(ls build/libs/*.jar)
          echo "Publishing $jar"
          # Java 21 bytecode is class-file major version 65. Anything higher would
          # fail to load on the 1.21.x half of the supported range.
          unzip -p "$jar" drHirsch/disable_front_camera/Disable_front_camera.class \
            | od -An -tu1 -j6 -N2 \
            | awk '{v=$1*256+$2; print "class file major version: " v; if (v != 65) { print "::error::Expected 65 (Java 21), got " v; exit 1 }}'
          unzip -p "$jar" META-INF/neoforge.mods.toml

      - name: Sanity-check the Forge jar
        if: steps.meta.outputs.forge != ''
        run: |
          jar=$(ls forge/build/libs/*.jar)
          echo "Publishing $jar"
          # The Forge jar only spans 26.x, where every version runs Java 25
          # (class-file major version 69) -- unlike the NeoForge jar it never has
          # to load on a Java 21 JVM.
          unzip -p "$jar" drHirsch/disable_front_camera/Disable_front_camera.class \
            | od -An -tu1 -j6 -N2 \
            | awk '{v=$1*256+$2; print "class file major version: " v; if (v != 69) { print "::error::Expected 69 (Java 25), got " v; exit 1 }}'
          unzip -p "$jar" META-INF/mods.toml

      # One mc-publish invocation per destination: each Modrinth version carries
      # exactly one loader's jar, and the GitHub release carries both. mc-publish
      # only publishes to platforms whose token is set, which is what separates
      # the three steps.
      - name: Publish to Modrinth (NeoForge)
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          # The immutable Modrinth project id, not the slug, so renaming the project
          # cannot break releases. It is public (the API serves it to anyone) and is
          # set here rather than in repository config because an empty modrinth-id
          # makes mc-publish fail before publishing anything, and a repo variable is
          # easy to get wrong -- it must be a Variable, not a Secret.
          # vars.MODRINTH_ID still overrides this if it is ever set.
          modrinth-id: ${{ vars.MODRINTH_ID || 'WklfOz03' }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: build/libs/*.jar
          loaders: neoforge
          # Every version the matrix just verified, listed explicitly rather than
          # inferred from the jar's version range.
          game-versions: ${{ steps.meta.outputs.game_versions }}
          game-version-filter: none
          version: ${{ steps.meta.outputs.version }}
          name: v${{ steps.meta.outputs.version }}
          version-type: release

      - name: Publish to Modrinth (Forge)
        if: steps.meta.outputs.forge != ''
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          modrinth-id: ${{ vars.MODRINTH_ID || 'WklfOz03' }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: forge/build/libs/*.jar
          loaders: forge
          game-versions: ${{ steps.meta.outputs.forge_game_versions }}
          game-version-filter: none
          # The +forge suffix keeps the NeoForge version number plain (continuity
          # with every release so far) while giving the Forge version a distinct,
          # queryable number.
          version: ${{ steps.meta.outputs.version }}+forge
          name: v${{ steps.meta.outputs.version }} (Forge)
          version-type: release

      - name: Publish the GitHub release
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            build/libs/*.jar
            forge/build/libs/*.jar
          version: ${{ steps.meta.outputs.version }}
          name: v${{ steps.meta.outputs.version }}
          version-type: release

      # Confirm against the Modrinth API rather than trusting the step above to have
      # done what it reported. An earlier run silently dropped every game version and
      # would have published an unusable release had it not errored outright.
      - name: Verify the release reached Modrinth
        env:
          EXPECTED_VERSION: ${{ steps.meta.outputs.version }}
          EXPECTED_COUNT: ${{ steps.meta.outputs.game_version_count }}
          FORGE: ${{ steps.meta.outputs.forge }}
          EXPECTED_FORGE_COUNT: ${{ steps.meta.outputs.forge_game_version_count }}
        run: |
          published=$(curl -sS "https://api.modrinth.com/v2/project/WklfOz03/version")
          echo "$published" | jq -r '.[] | "\(.version_number)  loaders=\(.loaders|join(","))  versions=\(.game_versions|length)"'

          check () {
            v=$1; loader=$2; expected=$3
            actual=$(echo "$published" | jq --arg v "$v" '[.[] | select(.version_number == $v)] | first')
            if [ "$actual" = "null" ] || [ -z "$actual" ]; then
              echo "::error title=Not published::Modrinth has no version $v despite the publish step succeeding."
              exit 1
            fi
            if [ "$(echo "$actual" | jq --arg l "$loader" '.loaders | index($l)')" = "null" ]; then
              echo "::error title=Wrong loader::Version $v is not tagged with loader '$loader'."
              exit 1
            fi
            count=$(echo "$actual" | jq '.game_versions | length')
            if [ "$count" != "$expected" ]; then
              echo "::error title=Wrong game versions::Published $v with $count game versions, expected $expected."
              echo "$actual" | jq -r '.game_versions | join(", ")'
              exit 1
            fi
            echo "Published $v ($loader) to Modrinth for $count Minecraft versions."
          }

          check "$EXPECTED_VERSION" neoforge "$EXPECTED_COUNT"
          if [ -n "$FORGE" ]; then
            check "${EXPECTED_VERSION}+forge" forge "$EXPECTED_FORGE_COUNT"
          fi

  # Releases are usually started by the daily automation with GITHUB_TOKEN, and
  # nobody gets a failure email for those runs. An issue is the only signal the
  # maintainer actually sees, matching how update-versions.yml reports ports.
  notify-failure:
    name: File an issue on failure
    needs: [verify, publish]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Open an issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Falls back to the ref (the vX.Y.Z tag) when publish failed before its
          # meta step could resolve the version from gradle.properties.
          VERSION: ${{ needs.publish.outputs.version || github.ref_name }}
        run: |
          TITLE="Release $VERSION failed"

          # Don't file the same issue on every retry of the same version.
          existing=$(gh issue list -R "${{ github.repository }}" --state open \
            --search "$TITLE in:title" --json number --jq 'length')
          if [ "$existing" != "0" ]; then
            echo "An open issue already tracks this failed release."
            exit 0
          fi

          {
            echo "Publishing **$VERSION** failed."
            echo
            echo "See the run for details:"
            echo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "Once the cause is fixed, re-run the release from the Actions tab"
            echo "(Release > Run workflow at ref \`${{ github.ref_name }}\`)."
          } > issue.md

          gh issue create -R "${{ github.repository }}" --title "$TITLE" --body-file issue.md
