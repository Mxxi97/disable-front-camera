plugins {
    id 'java-library'
    id 'idea'
    // Version is resolved in settings.gradle from the moddev_version property.
    id 'net.neoforged.moddev'
}

group = mod_group_id

base {
    archivesName = mod_id
}

// The one and only version axis. Override with -Pneo_version=...
// The full set of supported versions lives in versions.json at the repo root.
def neoVersion = providers.gradleProperty('neo_version').get()

neoForge {
    version = neoVersion

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        configureEach {
            // Recommended logging data for a userdev environment
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// ---------------------------------------------------------------------------
// Everything below is derived from the NeoForge version rather than configured.
// ModDevGradle resolves both of these once neoForge.version is set, which is why
// the CI matrix only has to carry neo_version: it cannot drift out of sync with
// the Minecraft version, and it survived Minecraft's switch from 1.21.x to 26.x
// version numbering without needing a lookup table.
// ---------------------------------------------------------------------------

// "1.21.8" on the old scheme, "26.2" on the new one.
def minecraftVersion = neoForge.minecraftVersion

// 21 through Minecraft 1.21.11; 25 from 26.1 onwards, because Mojang started
// shipping Java 25 to players there.
java.toolchain.languageVersion = JavaLanguageVersion.of(neoForge.versionCapabilities.javaVersion)

// One universal jar, so no Minecraft version in the name. The bytecode is identical
// for every supported version -- only the class-file stamp differs with the toolchain,
// which is why releases are built against the OLDEST supported NeoForge: that pins the
// output to Java 21 bytecode (loadable by the Java 25 JVM that Minecraft 26.x ships)
// and guarantees we only reference APIs present across the whole range.
version = mod_version

// ---------------------------------------------------------------------------
// Optional per-version source overlay.
//
// If src/versions/<minecraftVersion>/java (or src/versions/<series>/java) exists,
// it is added to the main source set and any file in it REPLACES the same-named
// file under src/main/java instead of colliding with it. That lets a single
// Minecraft version that breaks be patched without forking the source tree.
//
// Expected to be unused -- this is insurance for the next Minecraft release.
// ---------------------------------------------------------------------------
def minecraftSeries = minecraftVersion.startsWith('1.')
        ? minecraftVersion.tokenize('.').take(2).join('.')   // 1.21.8 -> 1.21
        : minecraftVersion.tokenize('.').take(1).join('.')   // 26.2   -> 26

def overlayRoot = [file("src/versions/${minecraftVersion}/java"),
                   file("src/versions/${minecraftSeries}/java")].find { it.isDirectory() }

def overriddenPaths = [] as Set
if (overlayRoot != null) {
    def overlayBase = overlayRoot.toPath()
    overlayRoot.eachFileRecurse(groovy.io.FileType.FILES) { f ->
        // Joined from path elements so the keys use '/' on every platform, matching
        // FileTreeElement.relativePath.pathString below.
        overriddenPaths << overlayBase.relativize(f.toPath()).collect { it.toString() }.join('/')
    }
    sourceSets.main.java.srcDir overlayRoot
    logger.lifecycle("Using source overlay ${overlayRoot} (overrides: ${overriddenPaths.join(', ')})")
}

if (!overriddenPaths.isEmpty()) {
    // A plain exclude('some/Path.java') would apply to every srcDir and drop the
    // overlay copy too, so discriminate on the absolute path of the source root.
    def basePrefix = file('src/main/java').absolutePath
    sourceSets.main.java.exclude { org.gradle.api.file.FileTreeElement element ->
        !element.directory &&
                element.file.absolutePath.startsWith(basePrefix) &&
                overriddenPaths.contains(element.relativePath.pathString)
    }
}

dependencies {
    // This mod has no dependencies beyond NeoForge itself.
}

// Expands the ${...} placeholders in src/main/templates into the real mod metadata.
// A missing property is an error.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version_range: minecraft_version_range,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Works for both a Gradle build and an IDE sync.
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// IDEA no longer automatically downloads sources/javadoc jars for dependencies.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
