# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# 4G because decompiling Minecraft is memory-hungry, especially on the 26.x targets.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Environment Properties
# The ModDevGradle plugin version. Resolved in settings.gradle.
moddev_version=2.0.147
# The NeoForge version to build against. This is the ONLY version axis: the Minecraft
# version, the Java toolchain and the mod metadata ranges are all derived from it in
# build.gradle. Override per build with -Pneo_version=...
# The full set of supported versions lives in versions.json at the repo root.
neo_version=26.2.0.88

## Universal jar compatibility ranges
# One jar covers every supported version, so these are declared ranges rather than
# the version the jar happened to be compiled against. They must not claim more than
# the build matrix in versions.json has actually proven: widen the lower bound only
# when dropping old versions, and leave the upper bound open only because the matrix
# re-verifies every new release before anything is published.
minecraft_version_range=[1.21.1,)
neo_version_range=[21.1,)
# The loader version range can only use the major version of FML as bounds.
loader_version_range=[4,)

# Parchment supplies parameter names for the decompiled Minecraft sources. It is a
# development-time convenience only and has no effect on the produced jar, so it is
# left off by default (and is not published at all for the 26.x versions).
# To enable it locally, set BOTH of these -- setting only one throws:
#   neoForge.parchment.minecraftVersion=1.21.11
#   neoForge.parchment.mappingsVersion=2025.12.20
# versions.json records the known-good mappings version for each target, and
# build-all.mjs passes them automatically.

## Mod Properties
# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=disable_front_camera
# The human-readable display name for the mod.
mod_name=disable front camera
# The license of the mod. Review your options at https://choosealicense.com/.
mod_license=MIT
# The mod version. See https://semver.org/
# The built jar appends the Minecraft version, e.g. disable_front_camera-1.1.0+mc26.2.jar
mod_version=1.1.0
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=drHirsch
# The authors of the mod. This is a simple text string that is used for display purposes in the mod list.
mod_authors=DrHirsch
# The description of the mod. This is a simple multiline text string that is used for display purposes in the mod list.
mod_description=Disables the front camera
