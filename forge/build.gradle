plugins {
    id 'java'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

// The mod's identity lives in the ROOT gradle.properties, shared with the
// NeoForge build, so bump-version.mjs and the metadata templates have a single
// source of truth. This build's own gradle.properties only carries the Forge
// version axis and the Forge-dialect ranges.
def shared = new Properties()
file('../gradle.properties').withInputStream { shared.load(it) }
def prop = { String name ->
    def value = shared.getProperty(name)
    if (value == null) throw new GradleException("Missing ${name} in ../gradle.properties")
    value
}

group = prop('mod_group_id')
version = prop('mod_version')
def modId = prop('mod_id')

base {
    // Distinct from the NeoForge jar (disable_front_camera-<version>.jar), so the
    // two artifacts can never be confused on Modrinth or in a mods folder.
    archivesName = "${modId}-forge"
}

// The one and only version axis of this build, as <minecraft>-<build>.
// Override with -Pforge_version=...
def forgeVersion = providers.gradleProperty('forge_version').get()

// Every supported Forge target (Minecraft 26.1+) runs on Java 25, so unlike the
// NeoForge build there is nothing to derive: 26.x is the whole range.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Straight from the Forge MDK: the mavenizer repo serves the locally deobfuscated
// Minecraft artifacts, and fg.* point at Forge's own maven and Mojang's libraries.
repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
        }
        register('client')
    }
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${forgeVersion}")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Expands the ${...} placeholders in src/main/templates into the real mod
// metadata -- the same pattern as the root build, but fed from both property
// files: identity from the shared one, ranges from the Forge-specific one.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [forge_minecraft_version_range: forge_minecraft_version_range,
                             forge_version_range          : forge_version_range,
                             forge_loader_version_range   : forge_loader_version_range,
                             mod_id                       : modId,
                             mod_name                     : prop('mod_name'),
                             mod_license                  : prop('mod_license'),
                             mod_version                  : prop('mod_version'),
                             mod_authors                  : prop('mod_authors'),
                             mod_description              : prop('mod_description')]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
