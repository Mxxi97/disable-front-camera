# Gradle settings for the Forge build only. A `-p forge` invocation treats this
# directory as the build root, so the root gradle.properties is NOT read here --
# the org.gradle.* performance settings are duplicated, while the mod properties
# (mod_id, mod_version, ...) are loaded from ../gradle.properties by build.gradle
# so they cannot drift from the NeoForge build.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# ForgeGradle 7 cannot fully serialize the compile classpath into the
# configuration cache yet; the Forge MDK demotes that to a warning, and without
# this the build FAILS after compiling successfully.
org.gradle.configuration-cache.problems=warn

# In a dev run the compiled classes and the processed resources live in separate
# directories; without this flag FML sees build/resources/main declare the mod,
# cannot find its classes there, and crashes on launch with "has mods that were
# not found". Straight from the Forge MDK.
net.minecraftforge.gradle.merge-source-sets=true

# The Forge version to build against, as the full maven artifact version
# <minecraft>-<build>. This is the only version axis of the Forge build; override
# per build with -Pforge_version=... The supported set lives in versions.json at
# the repo root (targets[].forge, null for versions Forge does not cover).
forge_version=26.2-65.1.3

## Universal jar compatibility ranges (Forge dialect)
# One jar covers every supported 26.x version. Forge support deliberately starts
# at Minecraft 26.1: the 1.21.x line would need the pre-rewrite Forge APIs and a
# Java 21 toolchain, and NeoForge already covers those players.
forge_minecraft_version_range=[26.1,)
# Forge build 62 is Minecraft 26.1, the oldest supported target.
forge_version_range=[62,)
# javafml's loader version tracks the Forge major version.
forge_loader_version_range=[62,)
